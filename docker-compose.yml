services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped #pra reiniciar o container caso ele caia
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-segredo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-bandido123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-segredo}:${RABBITMQ_PASS:-bandido123}@rabbitmq:5672/
      DB_PATH: /data/segredo.db
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - api-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  rabbitmq-data:
  api-data:
