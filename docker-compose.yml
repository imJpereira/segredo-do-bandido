services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB_PATH: /data/segredo.db
    volumes:
      - api-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  api-data:
